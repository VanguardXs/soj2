  <circle cx="91" cy="98" r="5" fill="#84c2ba"/>
  <rect x="233" y="92" width="67" height="11" rx="5.5" fill="#648d79" opacity=".8"/>

  <rect x="54" y="142" width="108" height="6" rx="3" fill="#709583"/>
  <rect x="54" y="160" width="67" height="6" rx="3" fill="#5e8c83"/>
  <rect x="54" y="181" width="83" height="6" rx="3" fill="#709583"/>
  <rect x="54" y="210" width="97" height="75" rx="9" fill="#29493f"/>
  <path d="m64 261 21-16 18 7 18-24 20 8" fill="none" stroke="#93d1ba" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="85" cy="245" r="4" fill="#d9ed98"/>
  <circle cx="121" cy="228" r="4" fill="#d9ed98"/>

  <rect x="242" y="262" width="62" height="7" rx="3.5" fill="#7aa997"/>
