  <path d="M181 135 245 159v64c0 52-24 88-64 112-40-24-64-60-64-112v-64Z" fill="url(#shield)" stroke="#f7f9e8" stroke-width="7" stroke-linejoin="round" filter="url(#shadow)"/>
