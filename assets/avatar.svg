  <circle cx="297" cy="174" r="5" fill="#c8b5df"/>
  <circle cx="283" cy="198" r="5" fill="#8cbcb0"/>
  <path d="m275 157 22 17-14 24" fill="none" stroke="#6f9b8f" stroke-width="2.5"/>

