<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" role="img" aria-labelledby="title description">
  <title id="title">Ақпараттық қауіпсіздік иллюстрациясы</title>
  <desc id="description">Оқиғаларды бақылау экранының алдында тексеру белгісі бар қорғаныс қалқаны.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#dbe9b7"/>
      <stop offset="1" stop-color="#b6ce92"/>
    </linearGradient>
    <linearGradient id="shield" x2="1" y2="1">
      <stop stop-color="#e9f3c4"/>
      <stop offset="1" stop-color="#a9cc80"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="11" stdDeviation="12" flood-color="#1b3a31" flood-opacity=".23"/>
    </filter>
  </defs>

  <rect width="360" height="400" fill="url(#background)"/>
  <circle cx="326" cy="49" r="91" fill="#eef3d5" opacity=".75"/>
  <circle cx="32" cy="359" r="87" fill="#a5c080" opacity=".55"/>
  <path d="M0 344c66-34 109-13 166 5 73 23 116-35 194-18v69H0Z" fill="#9bb97c" opacity=".7"/>

  <!-- Бақылау панелі: Blue Team жүйедегі оқиғаларды қадағалайды. -->
  <rect x="34" y="75" width="292" height="244" rx="21" fill="#1d3731" filter="url(#shadow)"/>
  <path d="M55 75h250c12 0 21 9 21 21v24H34V96c0-12 9-21 21-21Z" fill="#294a40"/>
  <circle cx="57" cy="98" r="5" fill="#e7b080"/>
